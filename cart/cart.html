<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | StyleVibe</title>
  <link rel="stylesheet" href="./cart.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div class="header-container">
      <a href="#" class="logo">
        <i class="fas fa-gem logo-icon"></i>
        StyleVibe
      </a>
      <div class="nav-left">
        <button class="nav-btn back-btn" onclick="window.location.href='../homepage/index.html'">
          <i class="fas fa-arrow-left"></i> Continue Shopping
        </button>
      </div>
    </div>
  </header>

  <main class="cart-page">
    <h1 class="cart-title">🛒 Your Shopping Cart</h1>

    <section class="cart-container">
      
      <div class="cart-items-list" id="cart-page-items">
        </div>

      <div class="summary">
    <div class="summary-details">
        <h2>Order Summary</h2>
        <div class="summary-row">
            <span>Subtotal:</span>
            <span id="summary-subtotal">₹0.00</span>
        </div>
        <div class="summary-row">
            <span>Shipping:</span>
            <span id="summary-shipping">₹0.00</span>
        </div>
        <div class="summary-row discount-row">
            <span>Discount:</span>
            <span id="summary-discount">-₹0.00</span>
        </div>
        <div class="summary-row total-row">
            <strong>Total:</strong>
            <strong id="summary-total">₹0.00</strong>
        </div>
        
<div class="coupon-box">
    <input type="text" id="coupon-code" placeholder="Enter coupon code">
    <button id="apply-coupon">Apply</button>
</div>
        
        <button class="checkout-btn">Proceed to Checkout</button>
        
    </div>
</div>


      </section>

    <section class="saved-items-section">
      <h2>❤️ Saved for Later</h2>
      <div class="saved-items" id="saved-items">
        <p class="empty-saved">No items saved yet.</p>
      </div>
    </section>


  </main>

  <div id="toast-container"></div>

  <div id="checkout-modal" class="checkout-modal">
    <div class="checkout-content"> 
      <span class="close-btn" id="close-checkout">&times;</span>
      <h2 class="checkout-title">Checkout</h2>
      <div class="checkout-total" id="checkout-total">Total Payable: ₹0</div>

      <form id="checkout-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="address">Shipping Address</label>
        <textarea id="address" rows="3" placeholder="Enter your address" required></textarea>

        <label for="payment">Payment Method</label>
        <select id="payment" required>
          <option value="">Select Payment Option</option>
          <option value="cod">Cash on Delivery</option>
          <option value="card">Credit/Debit Card</option>
        </select>

        <button type="submit" class="modal-submit-btn">Place Order</button>
      </form>

      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Processing your order...</p>
      </div>

      <div id="success-msg" style="display:none; text-align:center;">
        <h2>Order Successful 🎉</h2>
        <p>Thank you for your purchase!</p>
        <button id="back-home" class="modal-submit-btn" style="margin-top: 12px;">
          🏠 Back to Home
        </button>
      </div>

    </div>
  </div>

  <script src="./cart.js"></script>
</body>

</html>
