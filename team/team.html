<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Crafters | Visionaries</title>

  <link rel="stylesheet" href="./team.css">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body class="p-4 md:p-8">

  <a href="../homepage/index.html"></a>
  <!-- Header -->
  <header class="text-center py-12 md:py-16">
    <h1 class="text-5xl md:text-7xl font-extrabold hero-title mb-4">The Visionaries</h1>
    <p class="text-gray-400 text-lg max-w-3xl mx-auto">
      Meet the Code Red — turning caffeine into code and vision into innovation.
    </p>
    <button onclick="window.location.href='../homepage/index.html'"
      class="mt-8 px-6 py-2 border-2 border-yellow-400 text-yellow-400 rounded-full hover:bg-yellow-400 hover:text-black transition duration-300">
      <i data-lucide="arrow-left" class="w-5 h-5 inline-block mr-2"></i> Back to Home
    </button>
  </header>

  <!-- Team Section -->
  <section class="max-w-7xl mx-auto pb-32">
    <!-- UPDATED: Increased all gaps significantly to improve spacing -->
    <div id="team-grid" class="flex flex-wrap justify-center gap-x-24 gap-y-28"></div>
  </section>

  <!-- Footer -->
  <footer>
    <!-- FIX: Changed via-green-400/40 to via-amber-400/40 -->
    <div class="h-[1px] w-3/4 mx-auto mb-5 bg-gradient-to-r from-transparent via-yellow-400/40 to-transparent"></div>
    <p>&copy; <span>2025 Code Red</span> — Engineered for Excellence.</p>
  </footer>

  <script src="./team.js"></script>

</body>

</html>
